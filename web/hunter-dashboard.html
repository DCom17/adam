<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="robots" content="noindex, nofollow">
<title>Hunter Dashboard — Adam</title>
<link rel="icon" href="/icon.png" type="image/png" />
<!-- In-app Hunter dashboard. Identical to the Apps Script ?view=mobile screen,
     but rendered here from the live board (GET /integrations/hunter/board) instead
     of being served by Google. Read-only. The bearer token is read from
     localStorage (same keys as the main app) and sent only in the Authorization
     header — never in a URL. All sheet values are escaped before render. -->
<style>
    :root {
      --bg:#04060b;
      --panel:rgba(15,23,42,.96);
      --panel2:rgba(17,24,39,.98);
      --cyan:#21e6ff;
      --cyan2:#8df2ff;
      --purple:#818cf8;
      --violet:#a78bfa;
      --green:#22c55e;
      --amber:#f59e0b;
      --red:#ef4444;
      --text:#f8fafc;
      --dim:#cbd5e1;
      --muted:#94a3b8;
      --line:rgba(33,230,255,.42);
      --line2:rgba(129,140,248,.38);
    }

    * {
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    ::selection { background: rgba(33,230,255,.28); color: #fff; }

    html {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      background:#04060b;
      font-size:15px;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body {
      width:100%;
      min-height:100svh;
      margin:0;
      padding:6.8px 5.4px calc(23.1px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% 0%, rgba(33,230,255,.24), transparent 32%),
        radial-gradient(circle at 92% 0%, rgba(129,140,248,.26), transparent 34%),
        linear-gradient(180deg,#020409 0%,#04060b 42%,#060d16 100%);
      color:var(--text);
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      overflow-x:hidden;
      line-height:1.45;
    }

    .app {
      width:100%;
      max-width:none;
      margin:0 auto;
      /* Scale the whole board down a touch on the phone — the native px sizes are
         large for a status window, so this gives breathing room without pushing the
         screen. Tune this one number to taste (1 = native, lower = more zoomed out). */
      /* intrinsic compact sizing — no zoom (iOS/webview-safe) */
    }

    .title {
      text-align:center;
      padding:15px 9.5px 12.9px;
      border:1px solid var(--line);
      background:rgba(2,6,23,.97);
      border-radius:15px;
      margin-bottom:10.9px;
      box-shadow:0 0 16.3px rgba(33,230,255,.22);
    }

    .title h1 {
      margin:0;
      color:var(--cyan2);
      font-size:21.8px;
      line-height:1.05;
      letter-spacing:1.4px;
      text-shadow:0 0 10.9px rgba(33,230,255,.55);
    }

    .title .sub {
      margin-top:6.8px;
      color:var(--muted);
      font-size:8.8px;
      line-height:1.4;
      letter-spacing:1px;
    }

    .frame,
    .expand-card,
    .alert,
    .status-card {
      border:1px solid var(--line);
      background:rgba(11,18,40,.95);
      border-radius:15px;
      box-shadow:
        0 0 15px rgba(33,230,255,.12),
        inset 0 0 16.3px rgba(15,23,42,.45);
    }

    .frame {
      padding:12.2px 9.5px;
      margin-bottom:10.9px;
    }

    .profile {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:9.5px;
    }

    .profile-label {
      color:var(--cyan);
      font-size:9.5px;
      letter-spacing:1.4px;
      text-transform:uppercase;
      margin-bottom:5.4px;
    }

    .profile-level {
      font-size:32.6px;
      line-height:1;
      font-weight:950;
      color:#fff;
    }

    .profile-rank {
      margin-top:5.4px;
      color:var(--violet);
      font-size:16.3px;
      font-weight:900;
    }

    .mode-badge {
      flex:0 0 auto;
      padding:6.8px 8.2px;
      border-radius:679.3px;
      border:1px solid var(--line);
      color:var(--cyan2);
      font-size:8.8px;
      font-weight:900;
      text-transform:uppercase;
      text-align:center;
      max-width:108.8px;
    }

    .mode-badge.good {
      border-color:rgba(34,197,94,.5);
      color:#bbf7d0;
      background:rgba(6,78,59,.35);
    }

    .mode-badge.warning {
      border-color:rgba(245,158,11,.55);
      color:#fde68a;
      background:rgba(120,53,15,.35);
    }

    .mode-badge.danger {
      border-color:rgba(239,68,68,.55);
      color:#fecaca;
      background:rgba(127,29,29,.35);
    }

    .status-grid {
      display:grid;
      grid-template-columns:1fr;
      gap:8.2px;
      margin-bottom:10.9px;
    }

    .status-card {
      padding:12.2px 10.9px;
      min-height:74.8px;
    }

    .status-label {
      color:var(--cyan);
      font-size:10.9px;
      letter-spacing:1.3px;
      text-transform:uppercase;
      margin-bottom:6.8px;
    }

    .status-value {
      color:#fff;
      font-size:21.8px;
      line-height:1.1;
      font-weight:900;
    }

    .alert {
      padding:13.6px 10.9px;
      margin-bottom:12.2px;
      transition:transform .22s ease, box-shadow .22s ease;
    }

    .alert.warning {
      border-color:rgba(245,158,11,.65);
      box-shadow:0 0 16.3px rgba(245,158,11,.12);
    }

    .alert.danger {
      border-color:rgba(239,68,68,.65);
      box-shadow:0 0 16.3px rgba(239,68,68,.12);
    }

    .alert-label {
      color:var(--cyan2);
      font-size:10.9px;
      letter-spacing:1.3px;
      text-transform:uppercase;
      margin-bottom:8.2px;
    }

    .alert.warning .alert-label {
      color:#fde68a;
    }

    .alert.danger .alert-label {
      color:#fecaca;
    }

    .alert-text {
      color:#fff;
      font-size:16.3px;
      line-height:1.45;
      font-weight:900;
    }

    .section {
      margin:17.7px 0 8.8px;
      color:var(--cyan2);
      font-size:13.6px;
      line-height:1.2;
      letter-spacing:1.45px;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      gap:6.8px;
      text-shadow:0 0 8.2px rgba(33,230,255,.35);
    }

    .section::before {
      content:"◇";
      color:var(--purple);
      font-size:13.6px;
    }

    .expand-card {
      padding:14.3px 12.2px;
      margin-bottom:10.9px;
      cursor:pointer;
      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease,
        background .22s ease;
      overflow:hidden;
    }

    .expand-card:active {
      transform:scale(.985);
    }

    .expand-card.open {
      border-color:rgba(103,232,249,.75);
      box-shadow:
        0 0 19px rgba(33,230,255,.24),
        inset 0 0 19px rgba(15,23,42,.55);
    }

    .boss-card {
      border-color:rgba(129,140,248,.55);
      animation:bossPulseV4 3.2s ease-in-out infinite;
    }

    @keyframes bossPulseV4 {
      0%, 100% {
        box-shadow:
          0 0 13.6px rgba(129,140,248,.13),
          inset 0 0 16.3px rgba(17,24,39,.45);
      }
      50% {
        box-shadow:
          0 0 23.1px rgba(129,140,248,.28),
          inset 0 0 19px rgba(17,24,39,.55);
      }
    }

    .card-main,
    .stat-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:9.5px;
    }

    .card-title {
      color:#fff;
      font-size:16.3px;
      line-height:1.42;
      font-weight:950;
    }

    .card-sub,
    .detail-line {
      color:var(--dim);
      font-size:12.2px;
      line-height:1.5;
      margin-top:5.4px;
    }

    .detail-line strong {
      color:var(--cyan2);
    }

    .right-stat {
      color:var(--cyan2);
      font-size:15.6px;
      font-weight:950;
      white-space:nowrap;
    }

    .expand-body {
      max-height:0;
      opacity:0;
      overflow:hidden;
      transform:translateY(-4.1px);
      transition:
        max-height .34s ease,
        opacity .24s ease,
        transform .24s ease;
    }

    .expand-card.open .expand-body {
      max-height:353.6px;
      opacity:1;
      transform:translateY(0);
      margin-top:9.5px;
    }

    .boss-kicker,
    .quest-label {
      color:var(--cyan);
      font-size:10.2px;
      letter-spacing:1.3px;
      text-transform:uppercase;
      margin-bottom:6.8px;
    }

    .boss-title {
      color:var(--violet);
      font-size:19px;
      line-height:1.33;
      font-weight:950;
      text-shadow:0 0 9.5px rgba(167,139,250,.32);
      margin-bottom:8.2px;
    }

    .boss-meta,
    .quest-meta,
    .debuff-meta {
      color:var(--dim);
      font-size:12.2px;
      line-height:1.5;
      margin-top:8.2px;
    }

    .boss-row {
      margin-top:8.2px;
      color:var(--dim);
      font-size:12.2px;
      line-height:1.5;
    }

    .boss-row strong {
      color:var(--cyan2);
    }

    .bar {
      width:100%;
      height:13.6px;
      border-radius:679.3px;
      background:rgba(30,41,59,.95);
      overflow:hidden;
      border:1px solid rgba(148,163,184,.2);
      margin:10.9px 0;
    }

    .bar-fill {
      height:100%;
      border-radius:679.3px;
      min-width:2px;
      box-shadow:0 0 10.9px currentColor;
      transition:width .8s ease;
    }

    .bar-fill.cyan {
      background:linear-gradient(90deg,var(--cyan),var(--cyan2));
      color:var(--cyan);
    }

    .bar-fill.purple {
      background:linear-gradient(90deg,var(--purple),var(--violet));
      color:var(--purple);
    }

    .quest-meta {
      display:flex;
      flex-direction:column;
      gap:3.4px;
    }

    .evidence,
    .debuff-counter {
      color:var(--muted);
      font-size:11.6px;
      line-height:1.45;
      margin-top:8.2px;
    }

    .pill {
      display:inline-block;
      margin-top:10.2px;
      border-radius:679.3px;
      padding:5.4px 8.8px;
      border:1px solid rgba(255,255,255,.16);
      font-weight:950;
      font-size:10.2px;
      line-height:1;
      text-transform:uppercase;
    }

    .complete {
      color:#bbf7d0;
      background:rgba(6,78,59,.82);
      border-color:rgba(34,197,94,.45);
    }

    .planned {
      color:#dbeafe;
      background:rgba(30,58,138,.82);
      border-color:rgba(59,130,246,.45);
    }

    .blocked {
      color:#fecaca;
      background:rgba(127,29,29,.82);
      border-color:rgba(239,68,68,.45);
    }

    .pending {
      color:#fde68a;
      background:rgba(120,53,15,.78);
      border-color:rgba(245,158,11,.45);
    }

    .rank-card.ready {
      border-color:rgba(34,197,94,.75);
      animation:rankReadyPulseV4 2.4s ease-in-out infinite;
    }

    @keyframes rankReadyPulseV4 {
      0%, 100% { box-shadow:0 0 13.6px rgba(34,197,94,.16); }
      50% { box-shadow:0 0 23.1px rgba(34,197,94,.32); }
    }

    .rank-title {
      color:var(--violet);
      font-size:16.3px;
      font-weight:950;
      line-height:1.35;
      margin-bottom:6.8px;
    }

    .rank-status {
      color:var(--cyan2);
      font-size:13.6px;
      font-weight:900;
      margin-bottom:8.2px;
    }

    .rank-card ul {
      margin:6.8px 0 0;
      padding-left:15px;
      color:var(--dim);
      font-size:12.2px;
      line-height:1.55;
    }

    .tap-hint {
      color:var(--muted);
      font-size:9.5px;
      margin-top:6.8px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .reload {
      width:100%;
      margin-top:15px;
      padding:13.6px 9.5px;
      border-radius:13.6px;
      border:1px solid var(--line);
      background:rgba(2,6,23,.96);
      color:var(--cyan2);
      font-weight:950;
      font-size:13.6px;
      letter-spacing:1.3px;
      font-family:inherit;
      box-shadow:0 0 12.2px rgba(33,230,255,.14);
    }

    .footer {
      margin-top:15px;
      color:var(--muted);
      font-size:10.2px;
      text-align:center;
      line-height:1.7;
      padding-bottom:4.1px;
    }

    @media (max-width:430px) {
      .title h1 {
        font-size:20.4px;
      }

      .profile-level {
        font-size:31.3px;
      }

      .alert-text {
        font-size:15.6px;
      }

      .boss-title {
        font-size:17.7px;
      }

      .card-title {
        font-size:15.6px;
      }

      .mode-badge {
        font-size:8.2px;
        max-width:98.6px;
      }
    }

/* ─── DESIGN MODE UPGRADE: COLOR ICONS + SYSTEM DIRECTIVE ───────────── */

.attr-main {
  align-items: center;
}

.attr-title-wrap {
  display: flex;
  align-items: center;
  gap: 9.5px;
}

.attr-icon {
  display: inline-flex;
  width: 31.3px;
  height: 31.3px;
  min-width: 31.3px;
  align-items: center;
  justify-content: center;
  border-radius: 10.2px;
  font-size: 19px;
  background: rgba(15, 23, 42, 0.88);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 0 10.9px rgba(33,230,255,.10);
}

.attr-discipline {
  border-color: rgba(96,165,250,.45);
}

.attr-knowledge {
  border-color: rgba(33,230,255,.55);
}

.attr-health {
  border-color: rgba(248,113,113,.55);
}

.attr-finance {
  border-color: rgba(52,211,153,.55);
}

.attr-career {
  border-color: rgba(251,191,36,.50);
}

.attr-spiritual {
  border-color: rgba(167,139,250,.60);
}

.attr-social {
  border-color: rgba(45,212,191,.55);
}

.attr-execution {
  border-color: rgba(250,204,21,.60);
}

.attr-discipline .attr-icon {
  box-shadow: 0 0 12.2px rgba(96,165,250,.25);
}

.attr-knowledge .attr-icon {
  box-shadow: 0 0 12.2px rgba(33,230,255,.28);
}

.attr-health .attr-icon {
  box-shadow: 0 0 12.2px rgba(248,113,113,.28);
}

.attr-finance .attr-icon {
  box-shadow: 0 0 12.2px rgba(52,211,153,.28);
}

.attr-career .attr-icon {
  box-shadow: 0 0 12.2px rgba(251,191,36,.24);
}

.attr-spiritual .attr-icon {
  box-shadow: 0 0 12.2px rgba(167,139,250,.30);
}

.attr-social .attr-icon {
  box-shadow: 0 0 12.2px rgba(45,212,191,.28);
}

.attr-execution .attr-icon {
  box-shadow: 0 0 13.6px rgba(250,204,21,.34);
}

/* Make status cards feel clickable */

.metric-card {
  position: relative;
}

.metric-card::after {
  content: "TAP FOR DETAILS";
  display: block;
  margin-top: 9.5px;
  color: var(--muted);
  font-size: 8.8px;
  letter-spacing: 1px;
}

.metric-card.open::after {
  content: "TAP TO COLLAPSE";
}

/* System Directive: separated important message */

.system-directive-wrap {
  margin: 20.4px 0 19px;
  padding: 8.2px 0;
}

.system-directive {
  position: relative;
  border: 1px solid rgba(103,232,249,.72);
  background:
    radial-gradient(circle at 50% 0%, rgba(33,230,255,.18), transparent 42%),
    linear-gradient(180deg, rgba(2,6,23,.98), rgba(15,23,42,.96));
  border-radius: 16.3px;
  padding: 16.3px 12.2px 15px;
  box-shadow:
    0 0 23.1px rgba(33,230,255,.22),
    inset 0 0 19px rgba(33,230,255,.06);
  animation: systemDirectivePulseV4 3.6s ease-in-out infinite;
}

@keyframes systemDirectivePulseV4 {
  0%, 100% {
    box-shadow:
      0 0 19px rgba(33,230,255,.18),
      inset 0 0 19px rgba(33,230,255,.05);
  }
  50% {
    box-shadow:
      0 0 29.9px rgba(33,230,255,.32),
      inset 0 0 23.1px rgba(33,230,255,.09);
  }
}

.system-label {
  color: var(--cyan2);
  font-size: 12.9px;
  font-weight: 950;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 12.2px;
  text-shadow: 0 0 13.6px rgba(103,232,249,.58);
}

.system-priority {
  color: var(--violet);
  font-size: 10.9px;
  font-weight: 900;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 12.2px;
}

.system-text {
  color: #e5f6ff;
  font-size: 14.3px;
  line-height: 1.55;
  font-weight: 400;
  text-align: left;
  letter-spacing: 0.3px;
  font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  text-shadow: 0 0 6.8px rgba(103, 232, 249, 0.18);
}

.system-text::before {
  content: "> ";
  color: var(--cyan2);
  font-weight: 700;
  text-shadow: 0 0 8.2px rgba(103, 232, 249, 0.5);
}

.system-sub {
  color: var(--muted);
  margin-top: 12.2px;
  font-size: 10.9px;
  line-height: 1.45;
  text-align: center;
}

.system-corner {
  position: absolute;
  width: 15px;
  height: 15px;
  border-color: var(--cyan2);
  opacity: .85;
}

.system-corner.top-left {
  top: 6.8px;
  left: 6.8px;
  border-top: 2px solid;
  border-left: 2px solid;
}

.system-corner.top-right {
  top: 6.8px;
  right: 6.8px;
  border-top: 2px solid;
  border-right: 2px solid;
}

.system-corner.bottom-left {
  bottom: 6.8px;
  left: 6.8px;
  border-bottom: 2px solid;
  border-left: 2px solid;
}

.system-corner.bottom-right {
  bottom: 6.8px;
  right: 6.8px;
  border-bottom: 2px solid;
  border-right: 2px solid;
}

.system-directive.warning {
  border-color: rgba(245,158,11,.72);
  box-shadow: 0 0 23.1px rgba(245,158,11,.20);
}

.system-directive.danger {
  border-color: rgba(239,68,68,.72);
  box-shadow: 0 0 23.1px rgba(239,68,68,.22);
}

.system-directive.warning .system-label {
  color: #fde68a;
}

.system-directive.danger .system-label {
  color: #fecaca;
}

@media (max-width: 430px) {
  .attr-icon {
    width: 29.9px;
    height: 29.9px;
    min-width: 29.9px;
    font-size: 17.7px;
  }

  .system-text {
    font-size: 17px;
  }

  .system-label {
    font-size: 12.2px;
  }

  .system-sub {
    font-size: 10.2px;
  }
}

/* ─── SYSTEM NOTIFICATION PANEL ───────────────────────────── */

.system-notification-wrap {
  margin: 24.5px 0 23.1px;
  padding: 5.4px 0;
}

.system-notification-frame {
  position: relative;
  padding: 12.2px 6.8px;
  border-radius: 13.6px;
  background:
    radial-gradient(circle at 50% 0%, rgba(33,230,255,.16), transparent 48%),
    linear-gradient(180deg, rgba(2,6,23,.20), rgba(15,23,42,.06));
}

.notification-rail {
  position: relative;
  height: 6.8px;
  margin: 0 auto;
  width: 92%;
  border-radius: 679.3px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(33,230,255,.35) 8%,
    rgba(103,232,249,1) 22%,
    rgba(96,165,250,1) 50%,
    rgba(103,232,249,1) 78%,
    rgba(33,230,255,.35) 92%,
    transparent 100%
  );
  box-shadow:
    0 0 12.2px rgba(33,230,255,.75),
    0 0 23.1px rgba(59,130,246,.45);
  animation: notificationRailPulseV4 3.2s ease-in-out infinite;
}

.rail-top {
  margin-bottom: -2px;
}

.rail-bottom {
  margin-top: -2px;
}

.notification-rail::before,
.notification-rail::after {
  content: "";
  position: absolute;
  top: -2.7px;
  width: 23.1px;
  height: 12.2px;
  border-top: 2px solid rgba(103,232,249,.85);
  border-bottom: 2px solid rgba(103,232,249,.45);
  opacity: .85;
}

.notification-rail::before {
  left: -2.7px;
  transform: skewX(-28deg);
}

.notification-rail::after {
  right: -2.7px;
  transform: skewX(28deg);
}

@keyframes notificationRailPulseV4 {
  0%, 100% {
    opacity: .88;
    filter: brightness(1);
  }
  50% {
    opacity: 1;
    filter: brightness(1.35);
  }
}

.notification-panel {

/* ══════════════════════════════════════════════════════════════════
   HUNTER BOOT LOADER  —  "SYSTEM INITIALIZING" skeleton assembly
   The dashboard draws itself out of the dark field: box outlines trace
   from a centre slit, blurred glitch-text snaps into the header/number
   slots, then the card fills bleed in with colour. Real data cross-fades
   over the instant the board lands (see loadBoard / finishBoot below).
   ══════════════════════════════════════════════════════════════════ */
.boot {
  position: relative;
  width: 100%;
  min-height: 100svh;
  animation: bootFade .35s ease;
}
@keyframes bootFade { from { opacity: 0; } to { opacity: 1; } }
.boot.sk-out { animation: skOut .26s ease forwards; }
@keyframes skOut { to { opacity: 0; transform: scale(1.012); filter: blur(2px); } }

.sk-app { width: 100%; }

/* --- a box: draws itself out of a centre slit, then the fill bleeds in --- */
.sk-box {
  position: relative;
  border: 1px solid rgba(103,232,249,.55);
  border-radius: 15px;
  margin-bottom: 10.9px;
  overflow: hidden;
  opacity: 0;
  clip-path: inset(48% 45% 48% 45% round 15px);
  box-shadow: 0 0 15px rgba(33,230,255,.14);
  animation: skDraw .62s cubic-bezier(.55,0,.3,1) forwards;
  animation-delay: calc(var(--i,0) * .13s);
}
@keyframes skDraw {
  0%   { opacity: 0; clip-path: inset(48% 45% 48% 45% round 15px); }
  16%  { opacity: 1; clip-path: inset(46% 1.5% 46% 1.5% round 15px); }
  52%  { opacity: 1; clip-path: inset(46% 0 46% 0 round 15px); }
  100% { opacity: 1; clip-path: inset(0 0 0 0 round 15px); }
}
/* the coloured card fill — arrives a beat after the outline is drawn */
.sk-box::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 0;
  background:
    radial-gradient(circle at 50% 0%, rgba(33,230,255,.10), transparent 62%),
    linear-gradient(180deg, rgba(11,18,40,.55), rgba(11,18,40,.95));
  animation: skFill .6s ease forwards;
  animation-delay: calc(var(--i,0) * .13s + .5s);
}
/* a single sweep of light as each panel powers up */
.sk-box::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(103,232,249,.22) 50%, transparent 60%);
  transform: translateX(-120%);
  animation: skSweep .7s ease forwards;
  animation-delay: calc(var(--i,0) * .13s + .18s);
}
@keyframes skFill  { from { opacity: 0; } to { opacity: 1; } }
@keyframes skSweep { to { transform: translateX(120%); } }

/* --- placeholder text/number bars: blurred, glitch into place --- */
.sk-line, .sk-blob, .sk-badge {
  position: relative;
  z-index: 1;
  border-radius: 5px;
  background: linear-gradient(90deg, rgba(103,232,249,.14), rgba(129,140,248,.30), rgba(103,232,249,.14));
  background-size: 220% 100%;
  opacity: 0;
  filter: blur(7px);
  animation:
    skGlitch .55s linear forwards,
    skShimmer 2.4s linear infinite;
  animation-delay:
    calc(var(--i,0) * .13s + .55s + var(--t,0) * .09s),
    calc(var(--i,0) * .13s + 1s);
}
@keyframes skGlitch {
  0%   { opacity: 0;   filter: blur(7px);   transform: translateX(-7px) skewX(6deg); }
  18%  { opacity: .45; filter: blur(6px);   transform: translateX(6px)  skewX(-4deg); }
  34%  { opacity: .12; filter: blur(7px);   transform: translateX(-4px) skewX(3deg); }
  52%  { opacity: .8;  filter: blur(3px);   transform: translateX(3px)  skewX(-2deg); }
  68%  { opacity: .3;  filter: blur(4px);   transform: translateX(-1px) skewX(1deg); }
  100% { opacity: .92; filter: blur(1.3px); transform: translateX(0)    skewX(0); }
}
@keyframes skShimmer {
  0%   { background-position: -60% 0; }
  100% { background-position: 160% 0; }
}

/* --- geometry that mirrors the real board's above-the-fold --- */
.sk-title { padding: 24px 11px 20px; min-height: 89px; text-align: center; }
.sk-title .sk-line { margin-left: auto; margin-right: auto; }
.sk-frame { padding: 12px 9.5px; }
.sk-card  { padding: 12px 11px; min-height: 74px; }
.sk-note  { padding: 18px 14px 20px; min-height: 118px; text-align: center; }
.sk-note .sk-line { margin-left: auto; margin-right: auto; }

.sk-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 9.5px; }
.sk-col { flex: 1; min-width: 0; }

.sk-h1    { height: 22px; width: 62%; margin-bottom: 9px; }
.sk-sub   { height: 8px;  width: 46%; }
.sk-label { height: 9px;  width: 40%; margin-bottom: 10px; }
.sk-lv    { height: 30px; width: 46%; margin-bottom: 8px; }
.sk-rank  { height: 14px; width: 30%; }
.sk-badge { height: 30px; width: 92px; border-radius: 999px; flex: 0 0 auto; }
.sk-num   { height: 22px; width: 42%; }
.sk-noteh { height: 14px; width: 52%; margin-bottom: 16px; }
.sk-note .sk-line.w1 { width: 82%; height: 11px; margin-bottom: 8px; }
.sk-note .sk-line.w2 { width: 68%; height: 11px; }

/* --- appended sections: notification panel + current boss --- */
.sk-notif { padding: 18px 14px 20px; min-height: 132px; text-align: center; }
.sk-notif-head { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 18px; }
.sk-icon { width: 28px; height: 28px; border-radius: 4px; flex: 0 0 auto; }
.sk-pill { width: 150px; height: 24px; border-radius: 4px; flex: 0 0 auto; }
.sk-notif .sk-line { margin-left: auto; margin-right: auto; }
.sk-notif .nw1 { width: 78%; height: 11px; margin-bottom: 8px; }
.sk-notif .nw2 { width: 84%; height: 11px; margin-bottom: 8px; }
.sk-notif .nw3 { width: 52%; height: 11px; }

.sk-seclabel { height: 12px; width: 46%; margin: 16px 0 9px; }
.sk-boss { padding: 12px 11px 14px; min-height: 96px; }
.sk-bosstitle { width: 46%; height: 22px; margin-bottom: 2px; }
.sk-progress { width: 100%; height: 13px; border-radius: 999px; margin: 10px 0 12px; }
.sk-bossmeta { width: 72%; height: 11px; }

/* --- global "scanning" pass + status readout --- */
.sk-scanline {
  position: fixed;
  left: 0; right: 0; top: -140px;
  height: 140px;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(103,232,249,.08) 46%, rgba(103,232,249,.16) 50%, rgba(103,232,249,.08) 54%, transparent);
  animation: skScan 2.8s ease-in-out .25s infinite;
}
@keyframes skScan {
  0%   { transform: translateY(0);      opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(calc(100svh + 140px)); opacity: 0; }
}
.sk-status {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 6;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2.6px;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(33,230,255,.25);
}
.sk-status .dot { color: var(--cyan2); animation: bootDots 1.4s steps(1) infinite; }
.sk-status .dot.d2 { animation-delay: .18s; }
.sk-status .dot.d3 { animation-delay: .36s; }
@keyframes bootDots { 0%,60% { opacity: .18; } 30% { opacity: 1; } }

/* --- real content eases in once the skeleton clears --- */
.app, .state-msg { animation: contentIn .45s ease both; }
@keyframes contentIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* --- reduced-motion: show the frame, skip the theatrics --- */
@media (prefers-reduced-motion: reduce) {
  .sk-box, .sk-box::before, .sk-box::after,
  .sk-line, .sk-blob, .sk-badge {
    animation: none !important;
    opacity: 1 !important;
    clip-path: none !important;
    filter: none !important;
    transform: none !important;
  }
  .sk-box::after { display: none; }
  .sk-scanline { display: none; }
}

/* ==  CELEBRATE ENGINE — CSS  (copy verbatim into hunter-dashboard)  == */

.cel-root{position:fixed;inset:0;z-index:9999;display:none;place-items:center;
  overflow:hidden;opacity:0;transition:opacity .32s ease;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  -webkit-tap-highlight-color:transparent;cursor:pointer;
  background:radial-gradient(120% 120% at 50% 45%, rgba(4,6,11,.72), rgba(2,3,7,.94) 70%);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.cel-root.on{display:grid;}
.cel-root.show{opacity:1;}
.cel-bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  pointer-events:none;mix-blend-mode:screen;transition:opacity .6s ease;}
.cel-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.cel-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;
  text-align:center;padding:24px;pointer-events:none;--acc:#21e6ff;--acc2:#8df2ff;}
.cel-eyebrow{font-size:12px;letter-spacing:7px;font-weight:800;color:#fcd34d;
  text-shadow:0 0 14px rgba(251,191,36,.7);opacity:0;animation:celDrop .5s ease forwards;}
.cel-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;
  transform:translateZ(0);}
.cel-flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(60% 60% at 50% 50%, #fff, var(--acc) 30%, transparent 70%);
  mix-blend-mode:screen;}
.cel-flash.fire{animation:celFlash .55s ease-out forwards;}
@keyframes celFlash{0%{opacity:0;transform:scale(.6)}18%{opacity:.95}100%{opacity:0;transform:scale(1.25)}}

/* vignette pulse (profile/rank) */
.cel-vig{position:absolute;inset:0;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 180px 40px var(--acc);transition:opacity .4s ease;}
.cel-root.vig-on .cel-vig{opacity:.35;}

.cel-sub{font-size:12px;letter-spacing:6px;color:var(--acc2);opacity:.9;font-weight:700;

/* enter animations */

  animation:celSlam .42s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes celDrop{to{opacity:1;transform:none}}
@keyframes celSlam{60%{opacity:1}to{opacity:1;transform:none;filter:blur(0)}}

/* progress bar */
.cel-bar-wrap{display:flex;flex-direction:column;gap:6px;width:min(78vw,440px);opacity:0;
  transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;}

.cel-bar{position:relative;height:14px;border-radius:9px;overflow:hidden;
  background:rgba(255,255,255,.06);
  border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);
  box-shadow:inset 0 0 12px rgba(0,0,0,.6),0 0 14px color-mix(in srgb,var(--acc) 30%,transparent);}

  letter-spacing:2px;}

.cel-lvl-to{color:var(--acc2);text-shadow:0 0 10px var(--acc);opacity:.55;transition:opacity .3s;}
.cel-root.fill-done .cel-lvl-to{opacity:1;}

.cel-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;

.cel-pre-rank{position:relative;}

  width:100%;pointer-events:none;}
.cel-pre-rank::before{color:#21e6ff;transform:translate(-3px,0);mix-blend-mode:screen;opacity:.7;
  animation:celAber 2.6s ease-in-out infinite;}
.cel-pre-rank::after{color:#f472b6;transform:translate(3px,0);mix-blend-mode:screen;opacity:.6;
  animation:celAber 2.6s ease-in-out infinite reverse;}
@keyframes celAber{0%,100%{transform:translate(-3px,0)}50%{transform:translate(3px,1px)}}
.cel-rank-old{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:clamp(120px,42vw,300px);font-weight:950;line-height:.9;color:var(--violet,#a78bfa);
  opacity:0;text-shadow:0 0 40px var(--violet,#a78bfa);}
.cel-rank-old.show{opacity:.55;animation:celVibe .12s linear infinite;}
.cel-rank-old.shatter{animation:celShatter .8s ease-in forwards;}
@keyframes celVibe{0%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}
  50%{transform:translate(calc(-50% - 2px),-50%)}75%{transform:translate(-50%,calc(-50% + 2px))}}
@keyframes celShatter{to{opacity:0;transform:translate(-50%,-50%) scale(1.5);filter:blur(14px)}}
.cel-rank-new{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.15);opacity:0;
  font-size:clamp(130px,46vw,340px);font-weight:950;line-height:.9;color:#fff;letter-spacing:2px;
  text-shadow:0 0 40px var(--violet,#a78bfa),0 0 100px var(--purple,#818cf8),0 0 180px var(--violet,#a78bfa);}

  celRankHold 2.6s ease-in-out .8s infinite;}
@keyframes celRankHold{0%,100%{text-shadow:0 0 40px var(--violet,#a78bfa),0 0 100px var(--purple,#818cf8),0 0 180px var(--violet,#a78bfa)}

.cel-rank-title{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);opacity:0;
  font-size:clamp(15px,4.5vw,26px);font-weight:900;letter-spacing:10px;color:#e9d5ff;
  text-shadow:0 0 18px var(--violet,#a78bfa);white-space:nowrap;}
.cel-rank-title.show{animation:celTitleIn .7s ease forwards;}
@keyframes celTitleIn{0%{opacity:0;letter-spacing:22px}100%{opacity:1;letter-spacing:10px}}
.cel-halo{position:absolute;left:50%;top:50%;width:min(78vw,560px);height:min(78vw,560px);
  margin:calc(min(39vw,280px) * -1) 0 0 calc(min(39vw,280px) * -1);opacity:0;pointer-events:none;
  background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--violet,#a78bfa) 60%,transparent),
    transparent 40%,color-mix(in srgb,var(--purple,#818cf8) 55%,transparent),transparent 70%);
  border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 44%,#000 46%,#000 60%,transparent 63%);
  mask:radial-gradient(circle,transparent 44%,#000 46%,#000 60%,transparent 63%);}
.cel-halo.spin{opacity:.9;animation:celSpin 9s linear infinite;}
@keyframes celSpin{to{transform:rotate(360deg)}}

/* screen shake */
.cel-shake{animation:celShake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes celShake{10%{transform:translate(-3px,2px)}30%{transform:translate(4px,-3px)}
  50%{transform:translate(-4px,3px)}70%{transform:translate(3px,2px)}90%{transform:translate(-2px,-2px)}}

/* tap hint */
.cel-hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);opacity:0;
  font-size:11px;letter-spacing:5px;color:#94a3b8;pointer-events:none;transition:opacity .5s ease;}

  .cel-pre-rank::before,.cel-pre-rank::after,.cel-rank-old.show{animation:none;}
