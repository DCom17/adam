<script>
/* ==== Celebrate: level-up / rank-up celebration overlay =================
   Self-contained, in its OWN <script> so any fault here can never break the
   dashboard loadBoard()/render() below. Exposes window.Celebrate.{check,demo}.
   Rank/milestone play a bundled Higgsfield clip from /celebrate/ (best-effort). */
/* ===================================================================== */
/* ==  CELEBRATE ENGINE — JS  (copy verbatim into hunter-dashboard)    == */
/* ==  Self-contained. Exposes window.Celebrate = { check, demo }.     == */
/* ===================================================================== */
window.Celebrate = (function () {
  "use strict";

  var ATTR_COLORS = {
    Discipline:["#21e6ff","#8df2ff"], Knowledge:["#818cf8","#c7d2fe"],
    Health:["#22c55e","#86efac"],     Finance:["#f59e0b","#fcd34d"],
    Career:["#a78bfa","#ddd6fe"],      Spiritual:["#e879f9","#f5d0fe"],
    Social:["#f472b6","#fbcfe8"],      Execution:["#2dd4bf","#99f6e4"]
  };
  var RANK_ORDER  = ["E","D","C","B","A","S","MASTER"];
  var RANK_TITLES = {E:"UNAWAKENED",D:"AWAKENING",C:"HUNTER",B:"ADVANCED HUNTER",
                     A:"ELITE HUNTER",S:"SHADOW-CLASS",MASTER:"NATIONAL LEVEL"};
  var VIOLET="#a78bfa", PURPLE="#818cf8";
  var LS_KEY="jarvis_hunter_progress";
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;}catch(e){}

  // ---- normalize a rank string ("E", "E Rank", "Master Rank", "National") ----
  function normRank(s){
    var t=String(s||"").toUpperCase().replace(/\bRANK\b/g,"").replace(/[^A-Z]/g,"").trim();
    if(t==="NATIONAL"||t==="MASTER"||t==="SS"||t==="SSS") return "MASTER";
    return RANK_ORDER.indexOf(t)>=0 ? t : "";
  }
  function rankIdx(s){ return RANK_ORDER.indexOf(normRank(s)); }

  // ---- DOM refs / runtime state ----
  var root,canvas,ctx,stage,flash,vig,hint,bgvideo,W,H,dpr;
  var rafId=null,lastTs=0,parts=[],MAXP=640;
  var queue=[],running=false,timers=[],tapArmed=false,activeUpdate=null,onSkip=null;
  var BG_BASE="/celebrate/", BG_OPACITY=0.72;   // Higgsfield energy clips, bundled in web/celebrate/ (tune to taste)
  var BG_EXT=(function(){ try{ var v=document.createElement("video");
    return (v.canPlayType && v.canPlayType('video/mp4; codecs="avc1.42E01E"')) ? ".mp4" : ".webm";
  }catch(e){ return ".mp4"; } })();   // H.264 mp4 where supported, else VP9 webm

  function ensureDom(){
    if(root) return;
    root=document.createElement("div"); root.className="cel-root";
    root.innerHTML=
      '<video class="cel-bg-video" muted playsinline preload="auto"></video>'+
      '<canvas class="cel-canvas"></canvas>'+
      '<div class="cel-vig"></div>'+
      '<div class="cel-stage"><div class="cel-flash"></div></div>'+
      '<div class="cel-hint">TAP TO CONTINUE</div>';
    document.body.appendChild(root);
    bgvideo=root.querySelector(".cel-bg-video");
    canvas=root.querySelector(".cel-canvas"); ctx=canvas.getContext("2d");
    stage=root.querySelector(".cel-stage"); flash=root.querySelector(".cel-flash");
    vig=root.querySelector(".cel-vig"); hint=root.querySelector(".cel-hint");
    root.addEventListener("click",function(){ if(tapArmed) skip(); });
    window.addEventListener("resize",resize);
  }
  // Background Higgsfield clip (rank supernova / milestone). Best-effort: if the file
  // is missing or blocked, the animation just runs without it.
  function playBg(name){
    if(!bgvideo) return;
    try{
      var url=BG_BASE+name+BG_EXT;
      if(bgvideo.getAttribute("src")!==url){ bgvideo.setAttribute("src",url); if(bgvideo.load) bgvideo.load(); }
      else { try{ bgvideo.currentTime=0; }catch(_){} }
      bgvideo.loop=false;
      var p=bgvideo.play(); if(p&&p.catch) p.catch(function(){});
      bgvideo.style.opacity=String(BG_OPACITY);
    }catch(e){}
  }
  function stopBg(){ if(!bgvideo) return; try{ bgvideo.style.opacity="0"; bgvideo.pause(); }catch(e){} }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+"px"; canvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function snd(name){ try{ if(window.parent&&window.parent.JVLSound) window.parent.JVLSound.play(name);
    else if(window.JVLSound) window.JVLSound.play(name); }catch(e){} }

  // ---- particle engine ----
  function P(o){ if(parts.length<MAXP) parts.push(o); }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function burst(x,y,n,spd,col,opt){
    opt=opt||{};
    for(var i=0;i<n;i++){
      var a=rand(0,Math.PI*2), s=rand(spd*0.3,spd), life=rand(opt.life||0.6,(opt.life||0.6)*1.7);
      P({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(opt.up||0),life:life,max:life,
         size:rand(opt.size||1.4,(opt.size||1.4)*2.4),col:col,drag:opt.drag||0.86,grav:opt.grav||420});
    }
  }
  function ring(x,y,n,spd,col,size){
    for(var i=0;i<n;i++){ var a=(i/n)*Math.PI*2;
      P({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:0.9,max:0.9,
         size:size||2,col:col,drag:0.9,grav:0}); }
  }
  function ember(col){
    P({x:rand(0,W),y:H+8,vx:rand(-16,16),vy:rand(-80,-150),life:rand(2.2,3.8),max:3.8,
       size:rand(1.8,4.2),col:col,drag:0.99,grav:-8,flick:true});
  }
  function spiral(cx,cy,col){
    var a=rand(0,Math.PI*2), r=rand(180,Math.max(W,H)*0.6);
    P({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,tx:cx,ty:cy,inward:true,ang:a,rad:r,
       life:0.9,max:0.9,size:rand(1.6,3),col:col,drag:1,grav:0});
  }
  function drawParts(dt){
    ctx.globalCompositeOperation="lighter";
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.life-=dt;
      if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.inward){
        p.rad-=(p.rad*3.2+40)*dt; p.ang+=dt*2.2;
        p.x=p.tx+Math.cos(p.ang)*p.rad; p.y=p.ty+Math.sin(p.ang)*p.rad;
        if(p.rad<8) p.life=0;
      }else{
        p.vx*=Math.pow(p.drag,dt*60); p.vy=p.vy*Math.pow(p.drag,dt*60)+p.grav*dt;
        p.x+=p.vx*dt; p.y+=p.vy*dt;
      }
      var al=Math.max(0,p.life/p.max); if(p.flick) al*=0.6+0.4*Math.sin(p.life*22);
      var s=p.size;
      ctx.globalAlpha=al*0.28; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,s*3.4,0,6.2832); ctx.fill();
      ctx.globalAlpha=al; ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(p.x,p.y,s,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }
  function loop(ts){
    rafId=requestAnimationFrame(loop);
    var dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0.016; lastTs=ts;
    ctx.clearRect(0,0,W,H);
    if(activeUpdate) activeUpdate(dt,ts);
    drawParts(dt);
  }

  // ---- timing helper ----
  function at(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

  // ---- rect helper (viewport/CSS px; canvas is 1:1 in CSS px) ----
  function rc(el){ var r=el.getBoundingClientRect(); return {l:r.left,t:r.top,w:r.width,h:r.height,
    cx:r.left+r.width/2,cy:r.top+r.height/2}; }

  function setAcc(a,b){ stage.style.setProperty("--acc",a); stage.style.setProperty("--acc2",b||a); }

  // ================= ATTRIBUTE =================
  function playAttr(ev){
    var col=ATTR_COLORS[ev.name]||["#21e6ff","#8df2ff"]; setAcc(col[0],col[1]);
    stage.querySelectorAll(".cel-col,.cel-big").forEach(function(n){n.remove();});
    var col1=col[0];
    var html=
      '<div class="cel-col">'+
        '<div class="cel-sub cel-in-drop">ATTRIBUTE LEVEL UP</div>'+
        '<div class="cel-name cel-in-drop" style="animation-delay:.06s">'+esc(ev.name.toUpperCase())+'</div>'+
        '<div class="cel-bar-wrap">'+
          '<div class="cel-bar"><div class="cel-bar-fill"></div><div class="cel-bar-head"></div></div>'+
          '<div class="cel-bar-labels"><span class="cel-lvl-from">LV '+ev.from+'</span>'+
          '<span class="cel-lvl-to">LV '+ev.to+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="cel-big"><span class="u">LV</span>'+ev.to+'</div>'+
      '<div class="cel-cap">'+esc(ev.name.toUpperCase())+'</div>';
    stage.insertAdjacentHTML("beforeend",html);
    var fill=stage.querySelector(".cel-bar-fill"), head=stage.querySelector(".cel-bar-head"),
        big=stage.querySelector(".cel-big");

    at(30,function(){ root.classList.add("show"); });
    at(300,function(){ root.classList.add("bar-on"); });
    var fillStart=0, FILL_DUR=1.9, barRect=null;
    at(640,function(){
      root.classList.add("fill-on"); barRect=rc(stage.querySelector(".cel-bar")); fillStart=performance.now();
      activeUpdate=function(dt,ts){
        var pr=Math.min(1,(ts-fillStart)/1000/FILL_DUR);
        var e=1-Math.pow(1-pr,2.2);              // ease-out
        fill.style.width=(e*100)+"%";
        head.style.left=(e*100)+"%";
        if(barRect){ var hx=barRect.l+e*barRect.w, hy=barRect.cy;
          for(var k=0;k<2;k++) P({x:hx,y:hy,vx:rand(-30,30),vy:rand(-60,10),life:rand(.3,.7),max:.7,
            size:rand(1,2.2),col:col1,drag:.9,grav:120}); }
        if(pr>=1){ activeUpdate=null; }
      };
    });
    at(640+FILL_DUR*1000,function(){ flashTo(big,col1,false); });
    at(640+FILL_DUR*1000+900,function(){ root.classList.add("hint-on"); });
    autoAdvance(640+FILL_DUR*1000+1900);
  }

  function flashTo(big,col1,isProfile){
    root.classList.add("fill-done");
    var colEl=stage.querySelector(".cel-col");        // fade the whole label group away
    if(colEl) colEl.classList.add("cel-fade-out");
    flash.classList.remove("fire"); void flash.offsetWidth; flash.classList.add("fire");
    big.classList.add("pop");
    var cap=stage.querySelector(".cel-cap"); if(cap) at(340,function(){ cap.classList.add("show"); });
    var cx=W/2, cy=H/2;
    ring(cx,cy,isProfile?46:30, isProfile?520:380, col1, isProfile?2.6:2);
    burst(cx,cy,isProfile?150:80, isProfile?560:420, col1,{life:0.8,size:1.8,up:40,grav:isProfile?300:360});
    burst(cx,cy,isProfile?70:34, isProfile?300:220,"#ffffff",{life:0.6,size:1.6,grav:200});
    snd(isProfile?"profileUp":"levelUp");
    if(isProfile && !reduce){ stage.classList.remove("cel-shake"); void stage.offsetWidth; stage.classList.add("cel-shake"); }
  }

  // ================= PROFILE =================
  function playProfile(ev){
    setAcc("#21e6ff","#8df2ff");
    stage.querySelectorAll(".cel-col,.cel-big,.cel-shock").forEach(function(n){n.remove();});
    var eyebrow=ev.milestone ? '<div class="cel-eyebrow">MILESTONE</div>' : '';
    var html=
      '<div class="cel-col">'+
        eyebrow+
        '<div class="cel-pre cel-in-slam">LEVEL UP</div>'+
        '<div class="cel-sub cel-in-drop" style="animation-delay:.12s">PROFILE LEVEL</div>'+
        '<div class="cel-bar-wrap lg">'+
          '<div class="cel-bar"><div class="cel-bar-fill"></div><div class="cel-bar-head"></div></div>'+
          '<div class="cel-bar-labels"><span class="cel-lvl-from">LV '+ev.from+'</span>'+
          '<span class="cel-lvl-to">LV '+ev.to+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="cel-big cel-big-lg"><span class="u">LV</span>'+ev.to+'</div>'+
      '<div class="cel-cap">PROFILE LEVEL</div>'+
      '<div class="cel-shock"></div><div class="cel-shock"></div>';
    stage.insertAdjacentHTML("beforeend",html);
    var fill=stage.querySelector(".cel-bar-fill"), head=stage.querySelector(".cel-bar-head"),
        big=stage.querySelector(".cel-big"), shocks=stage.querySelectorAll(".cel-shock");

    at(30,function(){ root.classList.add("show"); root.classList.add("vig-on"); if(ev.milestone) playBg("milestone"); });
    at(380,function(){ root.classList.add("bar-on"); });
    var fillStart=0, FILL_DUR=2.1, barRect=null;
    at(760,function(){
      root.classList.add("fill-on"); barRect=rc(stage.querySelector(".cel-bar")); fillStart=performance.now();
      activeUpdate=function(dt,ts){
        var pr=Math.min(1,(ts-fillStart)/1000/FILL_DUR), e=1-Math.pow(1-pr,2.2);
        fill.style.width=(e*100)+"%"; head.style.left=(e*100)+"%";
        if(barRect){ var hx=barRect.l+e*barRect.w, hy=barRect.cy;
          for(var k=0;k<3;k++) P({x:hx,y:hy,vx:rand(-40,40),vy:rand(-80,20),life:rand(.3,.8),max:.8,
            size:rand(1.2,2.6),col:"#21e6ff",drag:.9,grav:120}); }
        if(pr>=1) activeUpdate=null;
      };
    });
    at(760+FILL_DUR*1000,function(){
      flashTo(big,"#21e6ff",true);
      shocks[0].classList.add("go");
      at(140,function(){ shocks[1].classList.add("go"); });
      root.classList.remove("vig-on");
    });
    at(760+FILL_DUR*1000+1000,function(){ root.classList.add("hint-on"); });
    autoAdvance(760+FILL_DUR*1000+2200);
  }

  // ================= RANK =================
  function playRank(ev){
    setAcc(VIOLET,"#c4b5fd");
    stage.querySelectorAll(".cel-col,.cel-rank-old,.cel-rank-new,.cel-rank-title,.cel-halo,.cel-shock").forEach(function(n){n.remove();});
    var from=normRank(ev.from), to=normRank(ev.to);
    var fromLabel=from==="MASTER"?"NAT":from, toLabel=to==="MASTER"?"NAT":to;
    var title=RANK_TITLES[to]||"";
    var html=
      '<div class="cel-halo"></div>'+
      '<div class="cel-rank-old">'+esc(fromLabel)+'</div>'+
      '<div class="cel-rank-new">'+esc(toLabel)+'</div>'+
      '<div class="cel-col" style="justify-content:flex-start;position:absolute;top:11%;left:0;right:0">'+
        '<div class="cel-pre cel-pre-rank cel-in-slam" data-t="RANK UP">RANK UP</div>'+
      '</div>'+
      '<div class="cel-rank-title">'+esc(title)+'</div>'+
      '<div class="cel-shock"></div><div class="cel-shock"></div><div class="cel-shock"></div>';
    stage.insertAdjacentHTML("beforeend",html);
    var oldEl=stage.querySelector(".cel-rank-old"), newEl=stage.querySelector(".cel-rank-new"),
        titleEl=stage.querySelector(".cel-rank-title"), halo=stage.querySelector(".cel-halo"),
        shocks=stage.querySelectorAll(".cel-shock");
    if(to) playBg("rank-"+to.toLowerCase());   // Higgsfield energy behind the supernova

    var embersOn=true;
    at(30,function(){ root.classList.add("show"); root.classList.add("vig-on");
      activeUpdate=function(dt){ if(embersOn){ if(Math.random()<0.8) ember(VIOLET); if(Math.random()<0.4) ember(PURPLE); } };
    });
    at(700,function(){ oldEl.classList.add("show"); });
    at(1800,function(){                        // convergence
      oldEl.classList.add("shatter");          // keep .show so it shatters from a visible state
      var cx=W/2, cy=H/2, base=activeUpdate;
      activeUpdate=function(dt){ if(base) base(dt); for(var k=0;k<7;k++) spiral(cx,cy,Math.random()<0.5?VIOLET:PURPLE); };
    });
    at(2600,function(){                        // SUPERNOVA
      activeUpdate=function(dt){ if(embersOn){ if(Math.random()<0.8) ember(VIOLET); if(Math.random()<0.4) ember(PURPLE); } };
      flash.style.setProperty("--acc",VIOLET);
      flash.classList.remove("fire"); void flash.offsetWidth; flash.classList.add("fire");
      newEl.classList.add("pop");
      halo.classList.add("spin");
      var cx=W/2, cy=H/2;
      shocks[0].classList.add("go");
      at(120,function(){ shocks[1].classList.add("go"); });
      at(260,function(){ shocks[2].classList.add("go"); });
      ring(cx,cy,60,620,VIOLET,3); ring(cx,cy,40,420,"#c4b5fd",2.4);
      burst(cx,cy,200,640,VIOLET,{life:1.0,size:2,up:30,grav:260});
      burst(cx,cy,90,360,"#ffffff",{life:0.7,size:1.8,grav:180});
      burst(cx,cy,70,500,PURPLE,{life:1.2,size:2.2,up:60,grav:200});
      snd("rankUp");
      if(!reduce){ stage.classList.remove("cel-shake"); void stage.offsetWidth; stage.classList.add("cel-shake"); }
      root.classList.remove("vig-on");
    });
    at(3300,function(){ titleEl.classList.add("show"); });
    at(3600,function(){ root.classList.add("hint-on"); });
    autoAdvance(6500);
  }

  // ---- queue runner ----
  function autoAdvance(ms){ at(ms,function(){ skip(); }); }
  function reset(){
    clearTimers(); activeUpdate=null; tapArmed=false; parts.length=0; stopBg();
    root.className="cel-root on";               // keep displayed, drop phase classes
    stage.className="cel-stage";
    // rebuild flash node (class state reset)
    stage.innerHTML='<div class="cel-flash"></div>'; flash=stage.querySelector(".cel-flash");
    flash.style.removeProperty("--acc");
  }
  function playNext(){
    reset();
    if(!queue.length){ teardown(); return; }
    var ev=queue.shift();
    if(ev.type==="attr") playAttr(ev);
    else if(ev.type==="profile") playProfile(ev);
    else if(ev.type==="rank") playRank(ev);
    else { playNext(); return; }
    at(550,function(){ tapArmed=true; });   // tap-to-skip armed shortly after each starts
  }
  function skip(){ playNext(); }
  function teardown(){
    running=false;
    root.classList.remove("show");
    at(360,function(){ if(!running){ root.className="cel-root"; if(rafId){cancelAnimationFrame(rafId);rafId=null;} lastTs=0; parts.length=0; } });
  }
  function start(events){
    ensureDom(); resize();
    queue=events.slice(); running=true;
    root.classList.add("on");
    if(!rafId){ lastTs=0; rafId=requestAnimationFrame(loop); }
    playNext();
  }

  // ---- change detection ----
  function readSnap(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; } }
  function writeSnap(s){ try{ localStorage.setItem(LS_KEY,JSON.stringify(s)); }catch(e){} }
  function statsMap(board){
    var m={}, a=(board&&board.stats)||[];
    for(var i=0;i<a.length;i++){ var s=a[i]; if(s&&s.stat!=null){ var lv=parseInt(s.level,10);
      if(!isNaN(lv)) m[String(s.stat)]=lv; } }
    return m;
  }
  function curState(board){
    var st=(board&&board.state)||{};
    var lv=parseInt(st.character_level!=null?st.character_level:st.level,10);
    return { level:isNaN(lv)?0:lv, rank:normRank(st.rank), stats:statsMap(board) };
  }

  // Public: called on every dashboard load with the fetched board object.
  function check(board){
    try{
      ensureDom();
      var cur=curState(board);
      var snap=readSnap();
      // first ever load OR hunter not connected earlier: seed baseline silently
      if(!snap || typeof snap.level!=="number"){ writeSnap(mergeMax(cur,cur)); return; }

      var events=[];
      // attributes (only where we have a prior number and it increased)
      Object.keys(cur.stats).forEach(function(name){
        var to=cur.stats[name], from=snap.stats&&snap.stats[name];
        if(typeof from==="number" && to>from) events.push({type:"attr",name:name,from:from,to:to});
      });
      events.sort(function(a,b){ return (b.to-b.from)-(a.to-a.from); });   // biggest jumps first
      // profile
      if(typeof snap.level==="number" && cur.level>snap.level)
        events.push({type:"profile",from:snap.level,to:cur.level,milestone:(cur.level%5===0)});
      // rank
      var ci=RANK_ORDER.indexOf(cur.rank), si=RANK_ORDER.indexOf(snap.rank);
      if(ci>=0 && si>=0 && ci>si)
        events.push({type:"rank",from:snap.rank,to:cur.rank});

      // persist immediately (max-merged) so it never replays on the next open
      writeSnap(mergeMax(snap,cur));
      if(events.length) start(events);
    }catch(e){ /* never let a celebration bug break the dashboard */ }
  }
  function mergeMax(a,b){
    var out={level:Math.max(a.level||0,b.level||0),
             rank:RANK_ORDER.indexOf(a.rank)>=RANK_ORDER.indexOf(b.rank)?a.rank:b.rank,
             stats:{}};
    var names={}; [a.stats,b.stats].forEach(function(m){ if(m) Object.keys(m).forEach(function(k){names[k]=1;});});
    Object.keys(names).forEach(function(k){ out.stats[k]=Math.max((a.stats&&a.stats[k])||0,(b.stats&&b.stats[k])||0); });
    return out;
  }

  // Public: manual preview (does NOT touch the saved snapshot).
  function demo(type,opt){
    opt=opt||{};
    ensureDom();
    // rank-tier shortcuts so #celebrate=master / =s / =d ... preview a specific rank-up
    var RK={d:["E","D"],c:["D","C"],b:["C","B"],a:["B","A"],s:["A","S"],master:["S","MASTER"],national:["S","MASTER"]};
    if(RK[type]){ start([{type:"rank",from:RK[type][0],to:RK[type][1]}]); return; }
    if(type==="multi"){
      start([{type:"attr",name:"Knowledge",from:7,to:8},
             {type:"attr",name:"Health",from:4,to:5},
             {type:"profile",from:11,to:12},
             {type:"rank",from:"C",to:"B"}]);
      return;
    }
    if(type==="attr") start([{type:"attr",name:opt.name||"Discipline",from:opt.from||4,to:opt.to||5}]);
    else if(type==="profile") start([{type:"profile",from:opt.from||11,to:opt.to||12,milestone:!!opt.milestone}]);
    else if(type==="milestone") start([{type:"profile",from:opt.from||9,to:opt.to||10,milestone:true}]);
    else if(type==="rank") start([{type:"rank",from:opt.from||"C",to:opt.to||"B"}]);
  }

  // Full five-character escape. Every attribute this file writes is double-quoted
  // today, so &<> alone happened to be enough — but that is a property of the call
  // sites, not of the escaper, and it silently stops being true the first time
  // someone writes a single-quoted one.
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

  // Optional on-device preview: load the dashboard with #celebrate  (or #celebrate=rank|profile|attr|multi).
  // Inert in normal use — nothing runs unless that token is in the URL.
  try{
    var _m=(String(location.hash)+" "+String(location.search)).match(/celebrate(?:=([a-z]+))?/i);
    if(_m){ var _run=function(){ demo(_m[1]||"multi"); };
      if(document.body) setTimeout(_run,450);
      else window.addEventListener("DOMContentLoaded",function(){ setTimeout(_run,450); }); }
  }catch(e){}

  return { check:check, demo:demo };
})();
</script>

<script>
// --- transport: bearer token from localStorage (same keys as the main app),
// sent only in the Authorization header. Never in a URL. ---------------------
var LS = {
  get token() { return localStorage.getItem("jarvis_token") || ""; },
  get url() { return (localStorage.getItem("jarvis_url") || location.origin).replace(/\/$/, ""); }
};

function stateMsg(html) {
  document.getElementById("root").innerHTML = '<div class="state-msg">' + html + '</div>';
}

// --- boot loader timing ------------------------------------------------------
// MIN_BOOT_MS is how long the "system initializing" assembly is guaranteed to
// show even if the board returns instantly (local fetches are fast). Past this
// floor the skeleton is cross-faded out the moment data lands — so it never
// blocks a slow load, it just keeps a fast one from flashing. Tune to taste.
var MIN_BOOT_MS = 1900;   // success path — let the sequence read (through the boss box)
var ERR_BOOT_MS = 500;    // error / not-signed-in — surface quickly

function nowMs_() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
var BOOT_T0 = nowMs_();

// Hold until the floor, cross-fade the skeleton out, then swap in the real view.
function finishBoot(floorMs, cb) {
  var wait = Math.max(0, floorMs - (nowMs_() - BOOT_T0));
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (boot) { boot.classList.add("sk-out"); setTimeout(cb, 250); }
    else { cb(); }
  }, wait);
}

async function loadBoard() {
  if (!LS.token) { finishBoot(ERR_BOOT_MS, function () { stateMsg("Sign in to Adam first."); }); return; }
  try {
    var r = await fetch(LS.url + "/integrations/hunter/board", {
      headers: { "Authorization": "Bearer " + LS.token }
    });
    if (r.status === 403) { finishBoot(ERR_BOOT_MS, function () { stateMsg("Your Adam session was rejected — sign in again."); }); return; }
    var data = await r.json();
    if (!data.ok) {
      finishBoot(ERR_BOOT_MS, function () {
        stateMsg("<b>Your Operating System isn't set up yet.</b><br><br>Connect your own dashboard to see your" +
          " level, stats, and quests here.<br>" +
          '<a class="setup-cta" href="' + LS.url + '/setup-hunter" target="_top">Open Operating System setup →</a>');
      });
      return;
    }
    finishBoot(MIN_BOOT_MS, function () {
      var _b = data.board || {};
      render(shape(_b));
      if (window.Celebrate) { try { Celebrate.check(_b); } catch (e) {} }   // celebrate any new level/rank
    });
  } catch (e) {
    finishBoot(ERR_BOOT_MS, function () { stateMsg("Could not reach your Adam server."); });
  }
}

// --- escaping + numeric helpers (ported verbatim) ---------------------------
function safeV4_(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function numV4_(value) {
  var n = Number(String(value || "0").replace("%", "").trim());
  return isNaN(n) ? 0 : n;
}

// --- canonical level curve (xp_rules.md) -----------------------------------
// XP_to_next(L) = 50 * (L + 1);  Cumulative(1) = 0, Cumulative(L) = 50*(L(L+1)/2 - 1).
// The board's own character_level cell is formula-driven and has historically
// measured something else (a stat-level composite) or gone stale, while total_xp
// is rewritten by every sync. Derive from total_xp so this window can never
// disagree with what Adam says in chat.
function levelCumulativeXpV4_(level) {
  // toStatNumberV4_ (not numV4_) so a display-formatted "2,135" still parses.
  var L = Math.max(1, Math.floor(toStatNumberV4_(level, 0)));
  if (L <= 1) return 0;
  return 50 * ((L * (L + 1)) / 2 - 1);
}
function levelFromXpV4_(totalXp) {
  var xp = toStatNumberV4_(totalXp, 0);
  if (!(xp > 0)) return 1;
  var L = Math.floor((-1 + Math.sqrt(1 + 8 * (xp / 50 + 1))) / 2);
  if (!isFinite(L) || L < 1) L = 1;
  // Correct for float drift at the boundaries in both directions.
  while (levelCumulativeXpV4_(L + 1) <= xp) L++;
  while (L > 1 && levelCumulativeXpV4_(L) > xp) L--;
  return L;
}
function levelProgressV4_(totalXp) {
  var xp = toStatNumberV4_(totalXp, 0);
  if (xp < 0) xp = 0;
  var level = levelFromXpV4_(xp);
  var start = levelCumulativeXpV4_(level);
  var end = levelCumulativeXpV4_(level + 1);
  return {
    level: level,
    nextLevel: level + 1,
    xpIntoLevel: xp - start,
    xpRemaining: Math.max(0, end - xp),
    levelCost: end - start
  };
}

function extractBossIdV4_(value) {
  var text = String(value || "").trim();
  var match = text.match(/BOSS-\d+|B-\d+/i);
  return match ? match[0].toUpperCase() : text.toUpperCase();
}
function statusClassV4_(status) {
  var s = String(status || "").toLowerCase();
  if (s.includes("complete")) return "complete";
  if (s.includes("blocked")) return "blocked";
  if (s.includes("planned")) return "planned";
  if (s.includes("skip")) return "pending";
  return "pending";
}
function parseBossProgressV4_(value) {
  if (value === null || value === undefined || value === "") return 0;
  var cleaned = String(value).replace("%", "").replace(/[^\d.-]/g, "").trim();
  var num = Number(cleaned);
  if (isNaN(num)) return 0;
  return Math.max(0, Math.min(100, Math.round(num)));
}
function hasStatValueV4_(v) { return v !== undefined && v !== null && v !== ""; }
function toStatNumberV4_(value, fallback) {
  if (fallback === undefined) fallback = 0;
  if (value === null || value === undefined || value === "") return fallback;
  var cleaned = String(value).replace("%", "").replace(/[^\d.-]/g, "").trim();
  var num = Number(cleaned);
  return isNaN(num) ? fallback : num;
}
function clampStatPercentV4_(value) {
  var num = toStatNumberV4_(value, 0);
  return Math.max(0, Math.min(100, Math.round(num)));
}
function pctNormalizeV4_(v) {
  // The board returns progress_pct as a raw 0..1 ratio (Stats!progress_pct =
  // xp_into_level/xp_to_next). Display-formatted sources send "62%". Handle both:
  // a value in (0,1] is a fraction → scale to percent; anything larger is already
  // a percent.
  var n = toStatNumberV4_(v, 0);
  if (n > 0 && n <= 1) n = n * 100;
  return clampStatPercentV4_(n);
}
function getStatProgressPercentV4_(stat) {
  // 0 is a valid value — do not use || fallback here.
  if (hasStatValueV4_(stat.progress_pct)) return pctNormalizeV4_(stat.progress_pct);
  if (hasStatValueV4_(stat.progress_percent)) return pctNormalizeV4_(stat.progress_percent);
  var xpIntoLevel = toStatNumberV4_(stat.xp_into_level, 0);
  var xpToNext = toStatNumberV4_(stat.xp_to_next, 0);
  var span = xpIntoLevel + xpToNext;
  if (span > 0) return clampStatPercentV4_((xpIntoLevel / span) * 100);
  return 0;
}

// --- attribute meta (icons identical; copy de-personalized for shipping) ----
function attributeMetaV4_(statName) {
  var s = String(statName || "").toLowerCase();
  if (s.includes("discipline")) return { icon: "🛡️", className: "attr-discipline",
    meaning: "Discipline grows when you follow through on planned actions, keep commitments, and do the hard thing without needing perfect motivation.",
    value: "Higher Discipline makes your whole system more reliable. It keeps plans from becoming decorative fiction." };
  if (s.includes("knowledge")) return { icon: "📘", className: "attr-knowledge",
    meaning: "Knowledge grows through focused study, reading, note-making, and proving you understand what you learned.",
    value: "Higher Knowledge supports school, career growth, better decisions, and long-term leverage." };
  if (s.includes("health")) return { icon: "❤️", className: "attr-health",
    meaning: "Health grows through workouts, sleep, better food choices, hydration, and recovery.",
    value: "Higher Health gives you more energy, better mood, stronger focus, and less fatigue drag." };
  if (s.includes("finance")) return { icon: "💰", className: "attr-finance",
    meaning: "Finance grows when you track money, reduce waste, build savings, pay obligations, and improve income.",
    value: "Higher Finance means more freedom, less stress, and more room to make strategic moves." };
  if (s.includes("career")) return { icon: "🧭", className: "attr-career",
    meaning: "Career grows through skill-building, real work, portfolio building, networking, and professional evidence.",
    value: "Higher Career increases your earning power, credibility, and long-term options." };
  if (s.includes("spiritual")) return { icon: "✨", className: "attr-spiritual",
    meaning: "Spiritual grows through reflection, gratitude, humility, moral alignment, and choosing purpose over comfort.",
    value: "Higher Spiritual keeps the system grounded in meaning instead of empty productivity." };
  if (s.includes("social")) return { icon: "🗣️", className: "attr-social",
    meaning: "Social grows through communication, leadership, follow-ups, conflict handling, and getting better with people on purpose.",
    value: "Higher Social improves relationships, influence, and your ability to lead." };
  if (s.includes("execution")) return { icon: "⚡", className: "attr-execution",
    meaning: "Execution grows when you convert plans into finished actions and reduce the gap between intention and reality.",
    value: "Higher Execution means you get more done with less delay. This is the action stat." };
  return { icon: "◇", className: "attr-default",
    meaning: "This attribute grows when related actions are completed and confirmed with evidence.",
    value: "Higher levels represent stronger real-world ability in this area." };
}

function fatigueMeaningV4_(fatigueValue) {
  var f = numV4_(fatigueValue || 0);
  if (f >= 81) return { label: "Recovery Mode",
    meaning: "81–100 fatigue means capacity is heavily reduced. The system should stop stacking optional tasks.",
    advice: "Protect sleep, essentials, and recovery. Complete only critical quests." };
  if (f >= 61) return { label: "Conservation Mode",
    meaning: "61–80 fatigue means you can still move, but your plan needs to be lighter and more controlled.",
    advice: "Prioritize one or two meaningful wins. Do not build a fantasy schedule." };
  if (f >= 31) return { label: "Balanced Mode",
    meaning: "31–60 fatigue means you have usable capacity, but you need buffers and realistic pacing.",
    advice: "Push important tasks, but avoid unnecessary chaos." };
  return { label: "Push Mode",
    meaning: "0–30 fatigue means energy is available. This is the best range for attacking important quests.",
    advice: "Spend the energy on high-value work, not random scrolling." };
}

function momentumMeaningV4_(momentumValue) {
  var s = String(momentumValue || "Stable").toLowerCase();
  if (s.includes("rising") || s === "2" || s === "3") return { label: "Momentum rising",
    meaning: "Momentum rising means recent actions are stacking — completed quests, better follow-through, or streak progress are creating forward pressure.",
    advice: "Keep pressure on the current boss. Do not overcomplicate the next move." };
  if (s.includes("declining") || s.includes("falling") || s === "-1") return { label: "Momentum declining",
    meaning: "Momentum declining means follow-through has weakened, important blocks were missed, or planned actions are being deferred.",
    advice: "Shrink the next task until it is small enough to execute immediately." };
  if (s.includes("recovery")) return { label: "Recovery momentum",
    meaning: "Recovery means the system is intentionally protecting capacity instead of pushing full force.",
    advice: "Complete essentials, reduce overload, and rebuild momentum." };
  if (s.includes("overloaded")) return { label: "Overloaded",
    meaning: "Overloaded means there are too many active demands for the current energy, time, or attention available.",
    advice: "Cut, defer, or simplify. Hero mode is how plans go to die." };
  return { label: "Momentum stable",
    meaning: "Momentum stable means the system is holding position. You are not collapsing, but you are not accelerating either.",
    advice: "Choose one clear quest and create movement." };
}

function getFatigueModeV4_(fatigueValue) {
  var fatigue = numV4_(fatigueValue || 0);
  if (fatigue >= 81) return { label: "RECOVERY MODE", className: "danger", note: "Protect essentials. Cut optional quests." };
  if (fatigue >= 61) return { label: "CONSERVATION MODE", className: "warning", note: "Keep the plan realistic. No heroic nonsense." };
  if (fatigue >= 31) return { label: "BALANCED MODE", className: "normal", note: "Push important tasks, keep buffers." };
  return { label: "PUSH MODE", className: "good", note: "Energy is available. Spend it wisely." };
}

function normalizeRankV4_(value) {
  return String(value === null || value === undefined ? "" : value)
    .trim().toUpperCase().replace(/\s*RANK\s*$/, "").trim();
}

function getRankGateV4_(state, stats, rankRules) {
  var currentRank = String(state.rank || "E Rank").trim();
  // Same derived level the profile card shows, so the two never disagree.
  var characterLevel = (state.total_xp !== undefined && state.total_xp !== null && String(state.total_xp).trim() !== "")
    ? levelFromXpV4_(state.total_xp)
    : numV4_(state.character_level || state.level || 0);
  var statLevels = stats.map(function(s){ return numV4_(s.level || 0); }).filter(function(n){ return !isNaN(n); });
  var avgStat = statLevels.length ? Math.round((statLevels.reduce(function(a,b){return a+b;},0) / statLevels.length) * 10) / 10 : 0;
  var lowestStat = statLevels.length ? Math.min.apply(null, statLevels) : 0;

  if (!rankRules || rankRules.length === 0) {
    return { current: currentRank, next: "D Rank", status: "LOCKED", missing: ["Rank rules not loaded."], avgStat: avgStat, lowestStat: lowestStat };
  }
  // The vault writes "E"; the Rank_Rules tab writes "E Rank". Match on the tier
  // letter so a synced rank doesn't fall through and read as CLEARED / MAX.
  var idx = -1;
  var wanted = normalizeRankV4_(currentRank);
  for (var i = 0; i < rankRules.length; i++) {
    if (normalizeRankV4_(rankRules[i].rank) === wanted) { idx = i; break; }
  }
  if (idx === -1 || idx >= rankRules.length - 1) {
    return { current: currentRank, next: "MAX", status: "CLEARED", missing: [], avgStat: avgStat, lowestStat: lowestStat };
  }
  var next = rankRules[idx + 1];
  var minLevel = numV4_(next.min_character_level || 0);
  var minAvg = numV4_(next.min_average_stat || 0);
  var minLow = numV4_(next.min_lowest_stat || 0);
  var missing = [];
  if (characterLevel < minLevel) missing.push("Reach character level " + minLevel);
  if (avgStat < minAvg) missing.push("Average stat level " + minAvg);
  if (lowestStat < minLow) missing.push("Lowest stat level " + minLow);
  if (next.boss_requirement) missing.push(String(next.boss_requirement));
  var ready = missing.length === 0;
  return { current: currentRank, next: next.rank || "Next Rank", status: ready ? "READY REVIEW" : "LOCKED", missing: missing.slice(0, 4), avgStat: avgStat, lowestStat: lowestStat };
}

function getSystemAlertV4_(state, dailyQuests, weaknesses, fatigueMode) {
  var fatigue = numV4_(state.fatigue || 0);
  var directive = state.system_directive || state.directive || state.next_best_action || state.system_message || "";
  var className = "normal";
  if (fatigue >= 81) className = "danger";
  else if (fatigue >= 61) className = "warning";
  else if (fatigueMode && fatigueMode.className) className = fatigueMode.className;

  if (directive) return { label: "SYSTEM DIRECTIVE", priority: "CURRENT ORDER", text: directive, className: className };

  var pendingQuest = dailyQuests.find(function(q){
    var status = String(q.status || "").toLowerCase();
    return status.includes("pending") || status.includes("planned");
  });
  if (pendingQuest) return { label: "SYSTEM DIRECTIVE", priority: "QUEST TARGET", text: "Complete: " + (pendingQuest.quest || pendingQuest.title || "the next pending quest."), className: "normal" };

  return { label: "SYSTEM DIRECTIVE", priority: "NO ORDER LOADED", text: "Run daily planning and select the next tactical priority.", className: "normal" };
}

// --- shape the raw board into the view-model (getHunterMobileDataV4_) --------
function shape(board) {
  var state = board.state || {};
  var stats = (board.stats || []).slice(0, 8);
  var dailyQuests = (board.daily_quests || []).filter(function(q){ return q.quest || q.title; }).slice(0, 8);
  var bosses = (board.bosses || []).filter(function(b){ return b.name; }).slice(0, 8);
  var weaknesses = (board.weaknesses || []).filter(function(w){ return w.pattern; }).slice(0, 5);
  var rankRules = board.rank_rules || [];

  var activeBossRaw = state.active_boss || state.Active_Boss || "";
  var activeBossId = extractBossIdV4_(activeBossRaw);
  var activeBoss = bosses.find(function(b){
    var bossId = b.boss_id || b.id || b.Boss_ID || b.ID || "";
    return String(bossId).trim().toUpperCase() === String(activeBossId).trim().toUpperCase();
  });
  if (!activeBoss) activeBoss = bosses.find(function(b){ return String(b.name || "").trim() === String(activeBossRaw).trim(); });
  if (!activeBoss) activeBoss = bosses.find(function(b){
    var bossId = b.boss_id || b.id || b.Boss_ID || b.ID || "";
    return String(bossId).trim().toUpperCase().indexOf("BOSS-") === 0;
  });
  if (!activeBoss && bosses.length > 0) activeBoss = bosses[0];

  var fatigueMode = getFatigueModeV4_(state.fatigue);
  return {
    generated_at: new Date().toISOString(),
    state: state, stats: stats, dailyQuests: dailyQuests, bosses: bosses,
    activeBoss: activeBoss || {}, weaknesses: weaknesses,
    rankGate: getRankGateV4_(state, stats, rankRules),
    fatigueMode: fatigueMode,
    systemAlert: getSystemAlertV4_(state, dailyQuests, weaknesses, fatigueMode)
  };
}

// --- build the dashboard markup (ported from buildHunterMobileHtmlV4_) -------
function render(data) {
  var state = data.state || {};
  var activeBoss = data.activeBoss || {};
  var rankGate = data.rankGate || {};
  var fatigueMode = data.fatigueMode || {};
  var systemAlert = data.systemAlert || {};

  // Derive level + XP-to-next from total_xp when we have it; the board's own
  // character_level / xp_to_next cells are unreliable (see levelFromXpV4_).
  var rawTotalXp = state.total_xp;
  var hasTotalXp = hasStatValueV4_(rawTotalXp);
  var hasBoardLevel = hasStatValueV4_(state.character_level) || hasStatValueV4_(state.level);
  // No total_xp AND no level = a board that has never been synced. Show it as a
  // fresh Level 1 rather than "LV 0 // Unknown XP to reach Level 1".
  var curve = hasTotalXp ? levelProgressV4_(rawTotalXp)
            : (hasBoardLevel ? null : levelProgressV4_(0));

  var level = safeV4_(curve ? curve.level : (state.character_level || state.level || "0"));
  var rank = safeV4_(state.rank || "E Rank");
  var totalXp = safeV4_(hasTotalXp ? numV4_(rawTotalXp) : "0");
  var xpToNext = safeV4_(curve ? curve.xpRemaining : (state.xp_to_next || ""));
  var nextLevel = safeV4_(curve ? curve.nextLevel : (Number(state.character_level || state.level || 0) + 1 || ""));
  var fatigue = safeV4_(state.fatigue || "0");
  var momentum = safeV4_(state.momentum || "Stable");
  var mainQuest = safeV4_(state.main_quest || "Use the system.");
  var activeBossName = safeV4_(state.active_boss || activeBoss.name || "No active boss");

  var bossProgress = parseBossProgressV4_(activeBoss.progress_pct || activeBoss.progress_percent || activeBoss.progress || activeBoss.Progress || "0");
  var bossRank = safeV4_(activeBoss.difficulty_label || activeBoss.difficulty || "Unknown");
  var bossPhase = safeV4_(activeBoss.current_phase || "No phase set.");
  var bossNextMove = safeV4_(activeBoss.next_move || "No next move set.");
  var bossBlocker = safeV4_(activeBoss.main_blocker || "No blocker recorded.");
  var bossReward = safeV4_(activeBoss.reward_xp || "0");
  var fatigueInfo = fatigueMeaningV4_(state.fatigue);
  var momentumInfo = momentumMeaningV4_(state.momentum);

  var statsHtml = data.stats.map(function(stat){
    var rawName = stat.stat || stat.Stat || stat.attribute || stat.Attribute || "";
    var name = safeV4_(rawName);
    var lvl = safeV4_(stat.level || stat.Level || "1");
    var xp = safeV4_(stat.xp_total || stat.total_xp || stat.xp || "0");
    var trend = safeV4_(stat.trend_7d || stat.Trend_7d || "Stable");
    var pct = getStatProgressPercentV4_(stat);
    var meta = attributeMetaV4_(rawName);
    return '' +
      '<div class="expand-card stat-card attr-card ' + safeV4_(meta.className) + '" onclick="toggleCardV4(this)">' +
        '<div class="card-main attr-main">' +
          '<div class="attr-title-wrap">' +
            '<span class="attr-icon">' + safeV4_(meta.icon) + '</span>' +
            '<div><div class="card-title">' + name + '</div><div class="card-sub">Trend: ' + trend + '</div></div>' +
          '</div>' +
          '<div class="right-stat">LV ' + lvl + '</div>' +
        '</div>' +
        '<div class="bar"><div class="bar-fill cyan" style="width:' + pct + '%"></div></div>' +
        '<div class="expand-body">' +
          '<div class="detail-line"><strong>Total XP:</strong> ' + xp + '</div>' +
          '<div class="detail-line"><strong>Progress:</strong> ' + pct + '% to next level</div>' +
          '<div class="detail-line"><strong>Meaning:</strong> ' + safeV4_(meta.meaning) + '</div>' +
          '<div class="detail-line"><strong>Value:</strong> ' + safeV4_(meta.value) + '</div>' +
        '</div>' +
      '</div>';
  }).join("");

  var questsHtml = data.dailyQuests.map(function(q){
    var quest = safeV4_(q.quest || "");
    var stat = safeV4_(q.linked_stat || "");
    var boss = safeV4_(q.linked_boss || "");
    var xp = safeV4_(q.xp_value || "0");
    var status = safeV4_(q.status || "Pending");
    var type = safeV4_(q.type || "standard");
    var notes = safeV4_(q.notes || "");
    var statusClass = statusClassV4_(status);
    return '' +
      '<div class="expand-card quest-card ' + statusClass + '" onclick="toggleCardV4(this)">' +
        '<div class="quest-label">DAILY QUEST</div>' +
        '<div class="card-title">' + (quest || "Unnamed quest") + '</div>' +
        '<div class="quest-meta"><span>+' + xp + ' XP</span><span>' + (stat || "No stat") + '</span><span class="pill ' + statusClass + '">' + status + '</span></div>' +
        '<div class="expand-body">' +
          '<div class="detail-line"><strong>Linked Boss:</strong> ' + (boss || "None") + '</div>' +
          '<div class="detail-line"><strong>Type:</strong> ' + type + '</div>' +
          '<div class="detail-line"><strong>Notes:</strong> ' + (notes || "No notes.") + '</div>' +
        '</div>' +
      '</div>';
  }).join("");

  var weaknessesHtml = data.weaknesses.map(function(w){
    var pattern = safeV4_(w.pattern || "");
    var stat = safeV4_(w.stat || "");
    var severity = safeV4_(w.severity || "");
    var status = safeV4_(w.status || "");
    var countermeasure = safeV4_(w.countermeasure || "");
    var evidenceCount = safeV4_(w.evidence_count_30d || "");
    return '' +
      '<div class="expand-card debuff-card" onclick="toggleCardV4(this)">' +
        '<div class="card-title">⚠ ' + (pattern || "Unnamed weakness") + '</div>' +
        '<div class="card-sub">' + stat + ' // Severity ' + severity + ' // ' + status + '</div>' +
        '<div class="expand-body">' +
          '<div class="detail-line"><strong>Countermeasure:</strong> ' + (countermeasure || "No countermeasure set.") + '</div>' +
          '<div class="detail-line"><strong>Evidence Count:</strong> ' + (evidenceCount || "Not tracked.") + '</div>' +
        '</div>' +
      '</div>';
  }).join("");

  var missingRankHtml = (rankGate.missing || []).map(function(item){ return "<li>" + safeV4_(item) + "</li>"; }).join("");
  var rankClass = String(rankGate.status || "").toLowerCase().indexOf("ready") !== -1 ? "ready" : "locked";

  var html = '' +
    '<div class="app">' +
      '<div class="title"><h1>OPERATING SYSTEM</h1><div class="sub">SYSTEM ONLINE // MOBILE STATUS WINDOW</div></div>' +

      '<div class="frame">' +
        '<div class="profile">' +
          '<div class="profile-main">' +
            '<div class="profile-label">Profile</div>' +
            '<div class="profile-level">LV ' + level + '</div>' +
            '<div class="profile-rank">' + rank + '</div>' +
          '</div>' +
          '<div class="mode-badge ' + safeV4_(fatigueMode.className || "normal") + '">' + safeV4_(fatigueMode.label || "ACTIVE") + '</div>' +
        '</div>' +
        '<div class="boss-row">' + safeV4_(fatigueMode.note || "") + '</div>' +
      '</div>' +

      '<div class="status-grid">' +
        '<div class="expand-card status-card metric-card" onclick="toggleCardV4(this)">' +
          '<div class="status-label">Total XP</div><div class="status-value">' + totalXp + '</div>' +
          '<div class="expand-body">' +
            '<div class="detail-line"><strong>What it means:</strong> Total XP is the accumulated evidence of completed quests, milestones, boss progress, and confirmed actions.</div>' +
            (curve
              ? ('<div class="detail-line"><strong>This level:</strong> ' + curve.xpIntoLevel + ' / ' + curve.levelCost + ' XP into Level ' + curve.level + '</div>' +
                 '<div class="detail-line"><strong>Next Level:</strong> ' + curve.xpRemaining + ' more XP to reach Level ' + curve.nextLevel + '</div>')
              : ('<div class="detail-line"><strong>Next Level:</strong> ' + (xpToNext || "Unknown") + ' XP needed to reach Level ' + (nextLevel || "?") + '</div>')) +
          '</div>' +
        '</div>' +
        '<div class="expand-card status-card metric-card fatigue-card" onclick="toggleCardV4(this)">' +
          '<div class="status-label">Fatigue</div><div class="status-value">' + fatigue + '/100</div>' +
          '<div class="expand-body">' +
            '<div class="detail-line"><strong>' + safeV4_(fatigueInfo.label) + ':</strong> ' + safeV4_(fatigueInfo.meaning) + '</div>' +
            '<div class="detail-line"><strong>Planning advice:</strong> ' + safeV4_(fatigueInfo.advice) + '</div>' +
            '<div class="detail-line"><strong>Scale:</strong> 0–30 Push, 31–60 Balanced, 61–80 Conservation, 81–100 Recovery.</div>' +
          '</div>' +
        '</div>' +
        '<div class="expand-card status-card metric-card momentum-card" onclick="toggleCardV4(this)">' +
          '<div class="status-label">Momentum</div><div class="status-value">' + momentum + '</div>' +
          '<div class="expand-body">' +
            '<div class="detail-line"><strong>' + safeV4_(momentumInfo.label) + ':</strong> ' + safeV4_(momentumInfo.meaning) + '</div>' +
            '<div class="detail-line"><strong>Planning advice:</strong> ' + safeV4_(momentumInfo.advice) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="system-notification-wrap"><div class="system-notification-frame">' +
        '<div class="notification-rail rail-top"></div>' +
        '<div class="notification-panel">' +
          '<div class="notification-header"><div class="notification-icon">!</div><div class="notification-title">NOTIFICATION</div></div>' +
          '<div class="notification-message">' + safeV4_(systemAlert.text || "Run daily planning and select the next tactical priority.") + '</div>' +
        '</div>' +
        '<div class="notification-rail rail-bottom"></div>' +
      '</div></div>' +

      '<div class="section">Current Boss</div>' +
      '<div class="expand-card boss-card open" onclick="toggleCardV4(this)">' +
        '<div class="boss-kicker">Boss Arena</div>' +
        '<div class="boss-title">' + activeBossName + '</div>' +
        '<div class="bar"><div class="bar-fill purple" style="width:' + bossProgress + '%"></div></div>' +
        '<div class="boss-meta">Progress: ' + bossProgress + '% // Difficulty: ' + bossRank + ' // Reward: ' + bossReward + ' XP</div>' +
        '<div class="expand-body">' +
          '<div class="boss-row"><strong>Phase:</strong> ' + bossPhase + '</div>' +
          '<div class="boss-row"><strong>Next Move:</strong> ' + bossNextMove + '</div>' +
          '<div class="boss-row"><strong>Blocker:</strong> ' + bossBlocker + '</div>' +
        '</div>' +
        '<div class="tap-hint">Tap to expand/collapse</div>' +
      '</div>' +

      '<div class="section">Daily Quests</div>' +
      (questsHtml || '<div class="expand-card quest-card"><div class="card-title">No daily quests loaded.</div></div>') +

      '<div class="section">Attributes</div>' +
      (statsHtml || '<div class="expand-card stat-card"><div class="card-title">No stats found.</div></div>') +

      '<div class="section">Rank</div>' +
      '<div class="expand-card rank-card ' + rankClass + '" onclick="toggleCardV4(this)">' +
        '<div class="rank-title">' + safeV4_(rankGate.current || rank) + ' → ' + safeV4_(rankGate.next || "Next Rank") + '</div>' +
        '<div class="rank-status">' + safeV4_(rankGate.status || "LOCKED") + '</div>' +
        '<div class="card-sub">Average Stat: ' + safeV4_(rankGate.avgStat || "0") + ' // Lowest Stat: ' + safeV4_(rankGate.lowestStat || "0") + '</div>' +
        '<div class="expand-body">' +
          (missingRankHtml ? ('<ul>' + missingRankHtml + '</ul>') : '<div class="boss-row">No missing requirements detected. Review required before promotion.</div>') +
        '</div>' +
        '<div class="tap-hint">Tap to expand/collapse</div>' +
      '</div>' +

      '<div class="section">Weakness / Debuffs</div>' +
      (weaknessesHtml || '<div class="expand-card debuff-card"><div class="card-title">No active debuffs loaded.</div></div>') +

      '<button class="reload" onclick="location.reload()">REFRESH STATUS</button>' +

      '<div class="section">How To Use This</div>' +
      '<div class="expand-card help-card" onclick="toggleCardV4(this)">' +
        '<div class="card-title">📖 Commands &amp; daily flow</div>' +
        '<div class="card-sub">New here? Tap to see what to SAY to Adam to run your system. ' +
          'The board only fills in when you use these.</div>' +
        '<div class="expand-body">' +
          '<div class="detail-line"><strong>☀ Morning:</strong> say <strong>"Good morning"</strong> for your ' +
            'briefing, then <strong>"Start my day"</strong> (a.k.a. <strong>"Run daily planning"</strong>) — ' +
            'that\'s what builds your Daily Quests above.</div>' +
          '<div class="detail-line"><strong>⚡ During the day:</strong> work your quests. Say ' +
            '<strong>"Give me credit"</strong> when you finish something to earn XP.</div>' +
          '<div class="detail-line"><strong>🌙 End of day:</strong> say <strong>"How\'d we do"</strong> or ' +
            '<strong>"See you tomorrow"</strong> to score the day, log it, and prep tomorrow.</div>' +
          '<div class="detail-line"><strong>📅 Weekly:</strong> say <strong>"Big picture me"</strong> for a ' +
            'review of wins, misses, and bosses.</div>' +
          '<div class="detail-line"><strong>Good to know:</strong> XP needs evidence and ranks need review — ' +
            'there\'s no fake leveling. If the board looks empty, run <strong>daily planning</strong> first.</div>' +
        '</div>' +
        '<div class="tap-hint">Tap to expand/collapse</div>' +
      '</div>' +

      '<div class="footer">Main Quest: ' + mainQuest + '<br>Generated: ' + safeV4_(data.generated_at) + '<br>XP requires evidence. Rank requires review. No fake leveling.</div>' +
    '</div>';

  document.getElementById("root").innerHTML = html;
}

function toggleCardV4(card) {
  if (!card || !card.classList) return;
  card.classList.toggle("open");
}

loadBoard();
</script>
