<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Adam — Legal</title>
<link rel="icon" href="/icon.png" type="image/png" />
<style>
  :root {
    color-scheme: dark;
    --bg: #04060b; --panel: rgba(10, 20, 30, .55);
    --edge: rgba(33, 230, 255, .15); --edge-hi: rgba(33, 230, 255, .4);
    --cyan: #21e6ff; --cyan-soft: #8df2ff;
    --ink: #eefafd; --text: #c9e4ec; --dim: #8fb9c6; --faint: #5d8894;
    --amber: #ffaa3c; --danger: #ff4d6d;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(33,230,255,.28); color: #fff; }
  body { margin: 0; font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 18px; background: rgba(4,6,11,.7);
           -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
           border-bottom: 1px solid rgba(33,230,255,.08); }
  header h1 { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 0; font-weight: 600; }
  .brand-logo { width: 24px; height: 24px; filter: drop-shadow(0 0 8px rgba(33,230,255,.45)); }
  .wordmark { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
              font-weight: 800; letter-spacing: 6px; margin-right: -6px;
              background: linear-gradient(100deg, #fff 30%, #8df2ff 70%, #21e6ff);
              -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pagename { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700;
              color: var(--faint); padding-left: 12px; border-left: 1px solid var(--edge); }
  header .spacer { flex: 1; }
  a { color: var(--cyan); }
  main { max-width: 820px; margin: 0 auto; padding: 18px; }
  nav.docs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  nav.docs a { padding: 6px 12px; border: 1px solid var(--edge); border-radius: 999px;
               color: var(--dim); text-decoration: none; font-size: 12.5px; }
  nav.docs a:hover { color: var(--ink); border-color: var(--edge-hi); background: rgba(33,230,255,.06); }
  nav.docs a.active { color: #03222a; border: none; font-weight: 700;
                      background: linear-gradient(105deg, #eafcff, #8df2ff 55%, #21e6ff); }
  article { background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 22px 26px; }
  article h1 { font-size: 22px; color: var(--ink); margin: 0 0 4px; letter-spacing: -.01em; }
  article h2 { font-size: 16px; color: var(--ink); margin: 22px 0 6px; letter-spacing: -.01em; }
  article h3 { font-size: 14px; color: var(--cyan-soft); margin: 16px 0 4px; }
  article p { margin: 8px 0; }
  article ul, article ol { margin: 8px 0; padding-left: 22px; }
  article li { margin: 4px 0; }
  article strong { color: var(--ink); }
  article code { font-family: Consolas, "Cascadia Code", monospace; font-size: .92em; color: #b9ecf5;
                 background: rgba(33,230,255,.08); border: 1px solid var(--edge); border-radius: 6px; padding: 0 4px; }
  article hr { border: none; border-top: 1px solid var(--edge); margin: 18px 0; }
  article blockquote { margin: 12px 0; padding: 11px 14px; border-left: 3px solid var(--amber);
                       background: rgba(255,170,60,.06); border-radius: 0 10px 10px 0; color: #ffd9a8; }
  .status { color: var(--dim); padding: 18px; }
  .errbox { color: var(--danger); border: 1px solid rgba(255,77,109,.4); background: rgba(255,77,109,.05);
            border-radius: 10px; padding: 12px 14px; }
</style>
</head>
<body>

<header>
  <h1><img src="/logo.png" alt="" class="brand-logo"><span class="wordmark">ADAM</span><span class="pagename">Legal</span></h1>
  <span class="spacer"></span>
  <a href="/">Back to Adam</a>
</header>

<main>
  <nav class="docs" id="docNav">
    <a href="/legal?doc=eula"    data-doc="eula">EULA</a>
    <a href="/legal?doc=terms"   data-doc="terms">Terms of Service</a>
    <a href="/legal?doc=privacy" data-doc="privacy">Privacy Policy</a>
    <a href="/legal?doc=refund"  data-doc="refund">Refund Policy</a>
  </nav>
  <article id="doc"><div class="status">Loading…</div></article>
</main>

<script>
(function () {
  "use strict";
  var DOCS = { eula: "EULA", terms: "Terms of Service", privacy: "Privacy Policy", refund: "Refund Policy" };

  // Minimal, dependency-free Markdown → HTML for our own trusted legal docs. Escapes
  // first (defense in depth), then handles headings, hr, grouped blockquotes, lists,
  // paragraphs, and inline bold / code / links.
  function render(md) {
    var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
    var inline = function (s) {
      return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    };
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var html = "", para = [], quote = [], list = null;
    var flushPara = function () { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    var flushQuote = function () { if (quote.length) { html += "<blockquote>" + inline(quote.join(" ")) + "</blockquote>"; quote = []; } };
    var flushList = function () { if (list) { html += "</" + list + ">"; list = null; } };
    var flushAll = function () { flushPara(); flushQuote(); flushList(); };
    for (var k = 0; k < lines.length; k++) {
      var line = lines[k].replace(/\s+$/, ""), m;
      if (!line.trim()) { flushAll(); continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); var n = m[1].length; html += "<h" + n + ">" + inline(m[2]) + "</h" + n + ">"; continue; }
      if (/^---+$/.test(line.trim())) { flushAll(); html += "<hr>"; continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); quote.push(m[1]); continue; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) { flushPara(); flushQuote(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      if ((m = line.match(/^\d+\.\s+(.*)$/))) { flushPara(); flushQuote(); if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
      flushQuote(); flushList(); para.push(line.trim());
    }
    flushAll();
    return html;
  }

  function currentDoc() {
    var d = new URLSearchParams(location.search).get("doc") || "eula";
    return DOCS[d] ? d : "eula";
  }

  function markActive(doc) {
    var links = document.querySelectorAll("#docNav a");
    for (var i = 0; i < links.length; i++) links[i].classList.toggle("active", links[i].getAttribute("data-doc") === doc);
  }

  async function load() {
    var doc = currentDoc(), el = document.getElementById("doc");
    markActive(doc);
    document.title = "Adam — " + DOCS[doc];
    try {
      var r = await fetch("/legal/" + doc + ".md", { cache: "no-store" });
      if (!r.ok) throw new Error(String(r.status));
      el.innerHTML = render(await r.text());
    } catch (e) {
      el.innerHTML = '<div class="errbox">Couldn’t load this document (' + e.message + '). '
        + 'It also lives in your Adam folder under <code>web/legal/' + doc + '.md</code>.</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
